<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Investment Strategy Comparison</title>
  <script src="js/theme-init.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,500;8..60,600&display=swap">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="app-bar">
    <div class="app-bar-inner">
      <a href="#/" class="brand" aria-label="All projects">
        <span class="brand-mark" aria-hidden="true">
          <!-- Balance scale, tipped left: compares strategies -->
          <svg class="brand-scale" viewBox="0 0 24 24" fill="none" stroke-linecap="round" stroke-linejoin="round">
            <g class="scale-frame">
              <circle cx="12" cy="3.6" r="1.1" stroke-width="1.2"/>
              <path d="M12 4.7V19.2" stroke-width="1.6"/>
              <path d="M3.6 9.2C7 8.9 9.2 7.2 12 7.1C14.8 7 17 5.6 20.4 5.4" stroke-width="1.6"/>
              <path d="M8 20.8C8.6 18.9 10.1 17.9 12 17.9C13.9 17.9 15.4 18.9 16 20.8Z" class="scale-base"/>
            </g>
            <g class="scale-pan-low">
              <path d="M3.6 9.2L1.9 14.1M3.6 9.2L5.3 14.1" stroke-width="0.9"/>
              <path d="M1.4 14.1H5.8C5.6 15.6 4.7 16.5 3.6 16.5C2.5 16.5 1.6 15.6 1.4 14.1Z" class="scale-bowl"/>
            </g>
            <g class="scale-pan-high">
              <path d="M20.4 5.4L18.7 10.3M20.4 5.4L22.1 10.3" stroke-width="0.9"/>
              <path d="M18.2 10.3H22.6C22.4 11.8 21.5 12.7 20.4 12.7C19.3 12.7 18.4 11.8 18.2 10.3Z" class="scale-bowl"/>
            </g>
          </svg>
        </span>
        <span class="brand-name">Strategy Comparison</span>
      </a>
    </div>
  </header>
  <main id="app" class="container">
    <noscript>This app requires JavaScript.</noscript>
  </main>
  <script type="module" src="js/app.js"></script>
</body>
</html>
